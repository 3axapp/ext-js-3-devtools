<as-split unit="percent" [direction]="splitDirection()" [gutterSize]="7">
  <as-split-area #componentForestSplitArea size="60">
    <as-split direction="vertical" [gutterSize]="7" unit="pixel" [disabled]="true">
      <as-split-area size="*">
        <app-component-forest
          [forest]="forest()"
          (setParents)="handleSetParents($event)"
          (selectNode)="handleNodeSelection($event)"
          (toggleInspector)="toggleInspector.emit()"
          (highlightComponent)="highlightComponent($event)"
          (removeComponentHighlight)="removeComponentHighlight()"
        ></app-component-forest>
      </as-split-area>
      <as-split-area size="24">
        @if (parents()) {
          <app-breadcrumbs
            [parents]="parents()!"
            (handleSelect)="handleSelect($event)"
            (mouseOverNode)="highlightComponent($event)"
            (mouseLeaveNode)="removeComponentHighlight()"
          ></app-breadcrumbs>
        }
      </as-split-area>
    </as-split>
  </as-split-area>
  <as-split-area size="40" minSize="25" class="prop-split">
    @if (properties()) {
      <app-properties
        class="property-tab-wrapper"
        [currentSelectedElement]="currentSelectedElement()!"
        [properties]="properties()!"
        (inspect)="inspect($event)"
        (highlight)="highlightPropertyComponent($event)"
        (removeHighlight)="removeComponentHighlight()"
      ></app-properties>
    }
  </as-split-area>
</as-split>
