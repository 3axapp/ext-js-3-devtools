@if (currentSelectedElement()) {
  <div class="element-header">
    <div class="element-name">
      <div class="component-name">
        <a
          href="{{documentation()}}"
          target="_blank"
          class="documentation"
          matTooltip="Открыть документацию на sencha.com"
          (click)="$event.stopPropagation()"
        >
          <mat-icon class="docs-link">open_in_new</mat-icon>
        </a>
        <span>{{ currentSelectedElement().type }}</span>
      </div>
    </div>
  </div>
  <div class="component-properties">
    <mat-expansion-panel [expanded]="false">
      <mat-expansion-panel-header collapsedHeight="25px" expandedHeight="25px">
        <mat-panel-title>
          Родительские классы
        </mat-panel-title>
      </mat-expansion-panel-header>
      @for (type of properties().parentClasses; track $index) {
        <div class="parent-class">
          <a
            href="{{documentationUrl + type}}"
            target="_blank"
            class="documentation"
            matTooltip="Открыть документацию на sencha.com"
            (click)="$event.stopPropagation()"
          >
            <mat-icon class="docs-link">open_in_new</mat-icon>
          </a>
          <span>{{ type }}</span>
        </div>
      }
    </mat-expansion-panel>
    @for (panel of panels(); track $index) {
      <mat-expansion-panel [class]="panel.class" [expanded]="true">
        <mat-expansion-panel-header collapsedHeight="25px" expandedHeight="25px">
          <mat-panel-title>
            {{ panel.title }}
          </mat-panel-title>
        </mat-expansion-panel-header>
        <app-property-view-tree
          [dataSource]="panel.controls.dataSource"
          [treeControl]="panel.controls.treeControl"
          (inspect)="handleInspect($event, panel.parents)"
          (highlight)="handleHighlight($event, panel.parents)"
          (removeHighlight)="removeHighlight.emit()"
        />
      </mat-expansion-panel>
    }
  </div>
} @else {
  <div class="element-header">
    <div class="element-name">No selected Element</div>
  </div>
}
